<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Desktop Pet bubble</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      body {
        --edge: #2e9e5b;
        font: 600 14px/1.3 system-ui, 'Segoe UI', 'Leelawadee UI', Thonburi, sans-serif;
      }
      body[data-tone='waiting'] {
        --edge: #e8930c;
      }
      body[data-tone='failed'] {
        --edge: #d64545;
      }
      #wrap {
        position: absolute;
        inset: 0;
      }
      #wrap.pop {
        animation: pop 180ms ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Sits on the bottom edge, just above the pet; the script slides it sideways to stay over the tail. */
      #bubble {
        position: absolute;
        bottom: 11px;
        left: 4px;
        box-sizing: border-box;
        max-width: calc(100% - 8px);
        padding: 7px 13px;
        border: 2px solid var(--edge);
        border-radius: 14px;
        background: #fff;
        color: #2b2b33;
        text-align: center;
        overflow-wrap: anywhere;
      }
      /* Two lines at most; a longer name ends in an ellipsis. */
      #text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      /* How the answer began: smaller and quieter, under the words. Two lines at most. */
      #detail {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        margin-top: 2px;
        font-weight: 400;
        font-size: 12px;
        color: #5c5c68;
      }
      #detail:empty {
        display: none;
      }
      /* A square on its corner, half inside the bubble: the half that sticks out is the tail. */
      #tail {
        position: absolute;
        bottom: 5px;
        left: 50%;
        width: 11px;
        height: 11px;
        border-right: 2px solid var(--edge);
        border-bottom: 2px solid var(--edge);
        background: #fff;
        transform: translateX(-50%) rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="bubble"><span id="text"></span><span id="detail"></span></div>
      <div id="tail"></div>
    </div>
    <script src="./bubble.js"></script>
  </body>
</html>
