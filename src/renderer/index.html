<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; img-src file:; media-src file:; style-src 'unsafe-inline'"
    />
    <title>Desktop Pet</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <script src="./renderer.js"></script>
  </body>
</html>
